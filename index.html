<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <meta name="theme-color" content="#0B0B0B" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Title (adopted by React 19's <title> singleton) and per-page meta
         description/OG tags are now rendered by each route's head() via
         <HeadContent /> in __root.tsx — see src/lib/seo.ts. Keeping a static
         <meta name="description"> here would create a duplicate description
         tag once a route overrides it. -->
    <title>Luxury Chauffeur Service Portugal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@400;600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@400;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript
      ><link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@400;600;700&display=swap"
        rel="stylesheet"
    /></noscript>
    <!-- Preload logo for LCP -->
    <link
      rel="preload"
      as="image"
      href="/lovable-uploads/118dab1d-996a-4565-bc16-7c458b7d64c5.png"
    />
    <!-- Hero image preload removed: vite-imagetools hashes the final path, making static preload ineffective -->
    <!-- Preconnect for external services (deferred) -->
    <link rel="dns-prefetch" href="https://maps.googleapis.com" />
    <link rel="dns-prefetch" href="https://www.paypal.com" />
  </head>
  <body class="min-h-screen antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
